name: Deploy no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissões que o deploy-pages precisa
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um que já esteja publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build estático (next build -> out/)
        run: npm run build
        env:
          # anon key: pública por design; a proteção é 100% RLS no Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # service_role: usada SÓ em generateStaticParams (build), para listar os
          # ids de pipe. Não tem prefixo NEXT_PUBLIC_ -> não entra no bundle.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
